name: Tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The workspace permission tests spawn real `deno` subprocesses, so the
      # runner needs Deno on PATH. Pinned to the version the suite is validated
      # against locally; bump deliberately after re-validating.
      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v1.42.4

      - name: Set up uv
        # setup-uv publishes exact version tags only (no floating "v10").
        uses: astral-sh/setup-uv@v10.2.0

      # Install from uv.lock (like the Dockerfile) so CI tests the exact
      # dependency versions we ship, not whatever pip resolves today.
      - name: Install dependencies
        run: uv sync --frozen --extra dev

      # web.save_url_as_pdf renders pages with headless Chromium via Playwright;
      # install the browser + its OS deps so the render tests actually run.
      - name: Install Playwright Chromium
        run: uv run --frozen playwright install --with-deps chromium

      - name: Run tests
        run: |
          uv run --frozen python -m pytest tests/ -v

  ui-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Run UI tests
        working-directory: web
        run: npm test
